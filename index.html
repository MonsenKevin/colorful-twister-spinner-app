  <style>
    :root{--paper:#f5f2ec;--ink:#282c2a;--muted:#858680;--line:#e3e0d9;--purple:#987be4;--red:#f37575;--blue:#80b1ed;--yellow:#f5d469;--green:#7bb99a;--display:'Space Grotesk',sans-serif;--body:'DM Sans',sans-serif}

    @keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
    @keyframes fade-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

    <symbol id="icon-hand" viewBox="0 0 32 32"><path d="M10 17V8.5a2 2 0 0 1 4 0V16M14 15V5.5a2 2 0 0 1 4 0V16M18 15V7.5a2 2 0 0 1 4 0V17M22 15V11.5a2 2 0 0 1 4 0V22c0 5-3.5 8-8 8-3 0-5-1.2-7-3.7l-6-8a2.2 2.2 0 0 1 3.4-2.8l3.6 4.3"/></symbol>

    <symbol id="icon-spin" viewBox="0 0 24 24"><path d="M20.2 10A8.4 8.4 0 0 0 5.5 6L3 9m0-5v5h5M3.8 14A8.4 8.4 0 0 0 18.5 18l2.5-3m0 5v-5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-volume" viewBox="0 0 24 24"><path d="m11 5-6 4H2v6h3l6 4V5Zm4 3a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-muted" viewBox="0 0 24 24"><path d="m11 5-6 4H2v6h3l6 4V5Zm5 4 5 6m0-6-5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-spark" viewBox="0 0 32 32"><path d="M16 3c0 9-4 13-13 13 9 0 13 4 13 13 0-9 4-13 13-13C20 16 16 12 16 3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </defs></svg>
  <div class="app-shell">
    <header class="header">
      <a class="brand" href="./" aria-label="Twist home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="brand-name">twist<span>!</span></span></a>
    </header>
    <main>
      <h1 class="visually-hidden">Twister spinner</h1>
      <section class="game-grid" aria-label="Twister spinner">
        <div class="wheel-card card">
          <div class="wheel-wrap">
            <svg class="wheel-svg" id="spinner-svg" viewBox="0 0 420 420" aria-label="Wheel with left hand, right hand, left foot, and right foot, each with red, blue, yellow, and green choices" role="img">
              <defs><filter id="hub-shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".13"/></filter></defs>
              <circle cx="210" cy="210" r="199" fill="#f0ede4"/>
              <circle cx="210" cy="210" r="194" fill="#fffefb" stroke="#dfddd3" stroke-width="1"/>
              <g id="wheel-disc"></g>
              <path class="wheel-pointer" d="m199 9 11 24 11-24c-7-3-15-3-22 0Z" fill="#303630"/>
              <g class="wheel-hub" id="wheel-hub" role="button" aria-label="Spin the wheel" aria-keyshortcuts="Enter Space" tabindex="0" filter="url(#hub-shadow)">
                <circle class="hub-main" cx="210" cy="210" r="38" fill="#303630"/>
                <circle cx="210" cy="210" r="31" fill="none" stroke="#ffffff22"/>
                <use class="hub-spin-icon" href="#icon-spin" x="200" y="188" width="20" height="20" style="color:#fff"/>
                <text class="hub-label" x="210" y="231" text-anchor="middle">SPIN</text>
              </g>
            </svg>
          </div>
        </div>
      </section>
      <section class="game-bottom" aria-label="Current move, recent moves, and voice setting">
        <section class="result-card current-move card" id="result-card" aria-labelledby="current-move-heading">
          <div class="card-topline"><h2 class="section-label" id="current-move-heading">Current move</h2></div>
          <div class="move-display" id="move-display" aria-live="polite" aria-atomic="true">
            <div class="move-symbol" id="move-symbol"><svg viewBox="0 0 32 32" aria-hidden="true"><use id="move-icon" href="#icon-spark"/></svg></div>
            <h3 class="move-title" id="move-title">Ready</h3>
            <p class="move-message" id="move-message">Tap the center to spin.</p>
            <span class="result-color" id="result-color"><i></i><span id="color-name"></span></span>
          </div>
        </section>
        <section class="history-card card" aria-labelledby="history-heading">
          <div class="card-topline"><h2 class="section-label" id="history-heading">Recent moves</h2><button class="clear-button" id="clear-button" disabled>Clear</button></div>
          <div class="history-list" id="history-list" aria-label="Recent moves"><p class="history-empty"><svg aria-hidden="true"><use href="#icon-spin"/></svg>No moves yet.</p></div>
        </section>
        <div class="voice-option card">
          <label class="voice-option-label" for="voice-toggle"><svg aria-hidden="true"><use href="#icon-volume"/></svg>Say moves out loud</label>
          <label class="toggle"><input id="voice-toggle" type="checkbox" aria-label="Say moves out loud"><span class="toggle-track"></span></label>
        </div>
      </section>
    </main>
  </div>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const NS = 'http://www.w3.org/2000/svg';
      const colors = [
        {name:'Red',fill:'#f37575',pale:'#fce9e7',ink:'#ba504e'},
        {name:'Blue',fill:'#80b1ed',pale:'#e8f0fc',ink:'#527dad'},
        {name:'Yellow',fill:'#f5d469',pale:'#fbf2d6',ink:'#9d7b26'},
        {name:'Green',fill:'#7bb99a',pale:'#e7f1e9',ink:'#568466'}
      ];
      const limbs = [
        {name:'Right hand',short:'RH',icon:'hand'},
        {name:'Right foot',short:'RF',icon:'foot'},
        {name:'Left foot',short:'LF',icon:'foot'},
        {name:'Left hand',short:'LH',icon:'hand'}
      ];
      const segments = [];
      let rotation = 0, spinning = false, history = [], voiceOn = false;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const disc = $('wheel-disc');
      function svgEl(tag, attrs) { const el = document.createElementNS(NS,tag); Object.entries(attrs).forEach(([key,val])=>el.setAttribute(key,String(val))); return el; }
      function point(radius,degrees){const a=degrees*Math.PI/180;return [210+radius*Math.sin(a),210-radius*Math.cos(a)];}
      function ringPath(start,end,outer,inner){const a=point(outer,start),b=point(outer,end),c=point(inner,end),d=point(inner,start);return `M${a.join(',')} A${outer},${outer} 0 0 1 ${b.join(',')} L${c.join(',')} A${inner},${inner} 0 0 0 ${d.join(',')} Z`;}
      // Each quadrant contains all four colors: sixteen equally likely moves.
      for(let q=0;q<4;q++){
        disc.appendChild(svgEl('path',{d:ringPath(q*90,(q+1)*90,190,29),fill:q%2===0?'#faf8f1':'#f3f0e6',stroke:'#fffefb','stroke-width':2}));
        const mid=q*90+45;
        const label=svgEl('text',{x:0,y:0,class:'wheel-label','text-anchor':'middle','dominant-baseline':'middle'});
        const lp=point(170,mid);
        label.setAttribute('transform',`translate(${lp[0]} ${lp[1]}) rotate(${mid>90&&mid<270?mid+180:mid})`);
        label.textContent=limbs[q].name.toUpperCase(); disc.appendChild(label);
        const iconPoint=point(78,mid);
        const icon=svgEl('use',{href:`#icon-${limbs[q].icon}`,x:-15,y:-15,width:30,height:30,class:'wheel-icon',transform:`translate(${iconPoint[0]} ${iconPoint[1]}) rotate(${mid>90&&mid<270?mid+180:mid})`});
        if(q===2||q===3)icon.setAttribute('transform',icon.getAttribute('transform')+' scale(-1 1)');
        disc.appendChild(icon);
        for(let c=0;c<4;c++){
          const angle=q*90+(c+.5)*22.5;
          const p=point(125,angle);
          disc.appendChild(svgEl('circle',{cx:p[0],cy:p[1],r:20,fill:colors[c].fill,stroke:colors[c].ink,'stroke-width':.7,'stroke-opacity':.13}));
          disc.appendChild(svgEl('circle',{cx:p[0]-4,cy:p[1]-5,r:6,fill:'#fff','fill-opacity':.12}));
          segments.push({limb:limbs[q],color:colors[c],angle});
        }
      }
      try {voiceOn=localStorage.getItem('twist-voice')==='true';}catch(e){}
      function saveSetting(key,value){try{localStorage.setItem(key,String(value));}catch(e){}}
      const canSpeak='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
      $('voice-toggle').checked=voiceOn && canSpeak;
      if(!canSpeak){voiceOn=false;$('voice-toggle').disabled=true;$('voice-toggle').closest('.voice-option').title='Your browser does not support spoken moves.';}
      $('voice-toggle').addEventListener('change',e=>{voiceOn=e.target.checked;saveSetting('twist-voice',voiceOn);if(!voiceOn&&canSpeak)window.speechSynthesis.cancel();});
      function randomInt(max){if(window.crypto&&window.crypto.getRandomValues){const arr=new Uint32Array(1);const cap=Math.floor(4294967296/max)*max;do{window.crypto.getRandomValues(arr);}while(arr[0]>=cap);return arr[0]%max;}return Math.floor(Math.random()*max);}
      function setSymbol(icon,color){const symbol=$('move-symbol');symbol.style.background=color?color.pale:'#f0eafc';symbol.style.color=color?color.ink:'#8a6ace';const svg=symbol.querySelector('svg');svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','1.6');svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');$('move-icon').setAttribute('href',`#icon-${icon}`);}
      function renderHistory(){
        const list=$('history-list');list.replaceChildren();$('clear-button').disabled=history.length===0;
        if(!history.length){const p=document.createElement('p');p.className='history-empty';const svg=svgEl('svg',{'aria-hidden':'true'});svg.appendChild(svgEl('use',{href:'#icon-spin'}));p.append(svg,document.createTextNode('No moves yet.'));list.appendChild(p);return;}
        history.forEach((move,i)=>{const item=document.createElement('span');item.className='history-item';item.style.background=move.color.pale;item.style.color=move.color.ink;item.title=`${i===0?'Latest: ':''}${move.limb.name} on ${move.color.name.toLowerCase()}`;item.setAttribute('aria-label',item.title);const svg=svgEl('svg',{viewBox:'0 0 32 32',fill:'none',stroke:'currentColor','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round','aria-hidden':'true'});svg.appendChild(svgEl('use',{href:`#icon-${move.limb.icon}`}));item.append(svg,document.createTextNode(`${move.limb.name} · ${move.color.name}`));list.appendChild(item);});
      }
      function showMove(move){
        $('result-card').classList.remove('spinning');$('move-title').textContent=move.limb.name;$('move-message').textContent='Move to an open circle.';setSymbol(move.limb.icon,move.color);$('result-color').style.display='inline-flex';$('result-color').style.background=move.color.pale;$('result-color').style.color=move.color.ink;$('color-name').textContent=`on ${move.color.name.toLowerCase()}`;
        history.unshift(move);history=history.slice(0,4);renderHistory();
        if(voiceOn&&canSpeak){window.speechSynthesis.cancel();const speech=new SpeechSynthesisUtterance(`${move.limb.name} on ${move.color.name.toLowerCase()}`);speech.lang='en-US';speech.rate=.92;window.speechSynthesis.speak(speech);}
      }
      function spin(){
        if(spinning)return;
        spinning=true;if(canSpeak)window.speechSynthesis.cancel();
        $('wheel-hub').setAttribute('aria-disabled','true');$('result-card').classList.add('spinning');$('move-title').textContent='Spinning…';$('move-message').textContent='Wait for the wheel to stop.';$('result-color').style.display='none';setSymbol('spin',null);
        const move=segments[randomInt(segments.length)];
        const current=((rotation%360)+360)%360;
        const target=(360-move.angle)%360;
        const delta=(target-current+360)%360;
        rotation+=(reduceMotion.matches?0:5+randomInt(3))*360+delta;
        const duration=reduceMotion.matches?150:3800;
        disc.style.transform=`rotate(${rotation}deg)`;
        setTimeout(()=>{spinning=false;$('wheel-hub').setAttribute('aria-disabled','false');try{showMove(move);}catch(e){$('result-card').classList.remove('spinning');}},duration+40);
      }
      $('wheel-hub').addEventListener('click',spin);
      $('wheel-hub').addEventListener('keydown',e=>{if(e.key==='Enter'||e.code==='Space'){e.preventDefault();spin();}});
      $('clear-button').addEventListener('click',()=>{history=[];renderHistory();});
      document.addEventListener('visibilitychange',()=>{if(document.hidden&&canSpeak)window.speechSynthesis.cancel();});
    })();
  </script>
</body>
</html>
